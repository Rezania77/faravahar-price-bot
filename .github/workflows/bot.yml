
name: Faravahar Price Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TALASANJ_KEY: ${{ secrets.TALASANJ_KEY }}
        run: python bot.py

      - name: Save previous prices
        run: |
          git config user.name "Faravahar Bot"
          git config user.email "bot@users.noreply.github.com"
          git add previous_prices.json
          git diff --cached --quiet || git commit -m "Update previous prices"
          git pull --rebase origin main
          git push origin main
